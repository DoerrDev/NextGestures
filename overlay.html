<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
      }
      #trail {
        display: block;
        width: 100%;
        height: 100%;
      }
      #label {
        position: fixed;
        left: 50%;
        top: 50%;
        max-width: min(560px, calc(100vw - 48px));
        padding: 9px 16px;
        border-radius: 8px;
        font: 600 18px/1.4 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
        color: #fff;
        background: rgba(18, 21, 27, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        visibility: hidden;
      }
      #label.visible {
        visibility: visible;
        animation: hint-drop-in 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #label.leaving {
        visibility: visible;
        animation: hint-fade-out 320ms ease both;
      }
      #label.static {
        visibility: visible;
        opacity: 1;
      }
      @keyframes hint-drop-in {
        from {
          opacity: 0;
          transform: translateY(-22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes hint-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #label.visible,
        #label.leaving {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="trail"></canvas>
    <div id="label"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
